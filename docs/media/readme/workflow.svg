  <g font-size="29" font-weight="650" class="ink"><text x="48" y="987">01  One action, one button</text><text x="570" y="987">02  Memory beside your draft</text><text x="1097" y="987">03  An autonomous writing loop</text></g>
  <g font-size="24" class="muted"><text x="48" y="1026">Polish or rewrite in place.</text><text x="48" y="1058">Skip repeated context and chat turns.</text><text x="570" y="1026">Recall current and past notes</text><text x="570" y="1058">without leaving the editor.</text><text x="1097" y="1026">Plan, execute, check and revise.</text><text x="1097" y="1058">Review changes, pause or revert.</text></g>
