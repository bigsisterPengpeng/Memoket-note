    <text x="47" y="25" font-size="29" font-weight="650">Memoket NOTE</text>
  </g>
  <text x="1552" y="55" text-anchor="end" class="label muted">AGENT-NATIVE WRITING WORKSPACE</text>
  <text x="48" y="130" class="ink" font-size="62" font-weight="650" letter-spacing="-2.2">Your notes. One click. Your next draft.</text>
  <text x="51" y="177" class="body muted">AI actions, lasting memory and an agent that runs the writing loop, together in your editor.</text>

  <text x="48" y="287" class="label muted">YOUR EXISTING NOTES</text>
  <g class="body ink">
    <text x="50" y="362">Markdown</text><text x="50" y="426">Obsidian</text><text x="50" y="490">Notion</text><text x="50" y="554">Apple Notes</text><text x="50" y="618">Evernote</text><text x="50" y="682">Feishu</text>
  </g>
  <path d="M224 337H238V681H224M238 509H325" fill="none" stroke="#b78129" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="283" y="481" text-anchor="middle" class="small muted">Import</text>

