<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">MEMOKET NOTE: Open-source Cursor for writing, with long-term memory.</title>
  <desc id="desc">An AI writing workspace with local knowledge and your choice of model. Agents work inside your document, recall notes and source evidence, and propose changes you can review, accept or undo.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#f6f3ed}.muted{fill:#b7b3aa}.gold{fill:#e2c38a}.ink{fill:#1c1c21}.violet{fill:#bdb2ff}.line{stroke:#57534d;stroke-width:2;fill:none}.card{fill:#202026;stroke:#47434a;stroke-width:2}</style>
  <rect width="1440" height="920" rx="28" fill="#141417"/>
  <text x="54" y="66" font-size="25" class="gold" font-weight="700">MEMOKET NOTE</text>
  <text x="790" y="66" font-size="22" class="muted" font-weight="400">LOCAL KNOWLEDGE · YOUR CHOICE OF MODEL</text>
  <text x="54" y="146" font-size="68" font-weight="700">Open-source Cursor for writing,</text>
  <text x="54" y="222" font-size="68" font-weight="700">with long-term memory.</text>
  <text x="56" y="276" font-size="30" class="muted">An agent that recalls your notes and source evidence.</text>
  <text x="56" y="316" font-size="30" class="muted">Write, revise and review changes inside your document.</text>
  <g transform="translate(0 100)">
  <rect x="54" y="258" width="270" height="500" rx="22" class="card"/>
  <text x="80" y="307" font-size="22" class="gold" font-weight="700">BRING YOUR NOTES</text>
  <text x="80" y="371" font-size="31" class="" font-weight="700">Markdown</text>
  <text x="80" y="410" font-size="25" class="muted" font-weight="400">&amp; Obsidian</text>
  <text x="80" y="490" font-size="31" class="" font-weight="700">Notion</text>
  <text x="80" y="529" font-size="25" class="muted" font-weight="400">Apple Notes · Feishu</text>
  <text x="80" y="609" font-size="31" class="" font-weight="700">Memoket</text>
  <text x="80" y="648" font-size="25" class="muted" font-weight="400">Recording briefs</text>
  <path d="M337 507h49m-13-13 13 13-13 13" stroke="#e2c38a" stroke-width="3" fill="none"/>
  <rect x="400" y="258" width="640" height="500" rx="22" class="card"/>
  <text x="428" y="307" font-size="24" class="gold" font-weight="700">WRITE WITH AN AGENT</text>
  <rect x="428" y="337" width="584" height="112" rx="15" fill="#302b43"/>
  <text x="449" y="376" font-size="28" font-weight="700">Agents work inside your document</text>
  <text x="449" y="418" font-size="27" class="violet">Plan · Write · Check · Revise</text>
  <rect x="428" y="469" width="584" height="112" rx="15" fill="#252b2c"/>
  <text x="449" y="508" font-size="28" font-weight="700">Memory across notes and sessions</text>
  <text x="449" y="550" font-size="27" class="muted">Dated facts, original words and sources</text>
  <rect x="428" y="601" width="584" height="125" rx="15" fill="#322e26"/>
  <text x="449" y="641" font-size="28" font-weight="700">Review each change</text>
  <text x="449" y="687" font-size="27" class="gold">Accept · Revert · Pause · Recover</text>
  <path d="M1053 507h49m-13-13 13 13-13 13" stroke="#e2c38a" stroke-width="3" fill="none"/>
  <rect x="1116" y="258" width="270" height="500" rx="22" class="card"/>
  <text x="1142" y="307" font-size="24" class="gold" font-weight="700">TAKE IT BACK</text>
  <text x="1142" y="391" font-size="31" class="" font-weight="700">Markdown</text>
  <text x="1142" y="433" font-size="27" class="muted" font-weight="400">&amp; Obsidian</text>
  <text x="1142" y="524" font-size="31" class="" font-weight="700">Notion</text>
  <text x="1142" y="566" font-size="27" class="muted" font-weight="400">&amp; Feishu</text>
  <text x="1142" y="681" font-size="29" class="" font-weight="700">You review.</text>
  <text x="1142" y="720" font-size="29" class="gold" font-weight="700">You decide.</text>
  </g>
</svg>
