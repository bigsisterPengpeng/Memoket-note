<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">MEMOKET NOTE: existing notes, one-click AI, memory and an agent harness, then export</title>
  <desc id="desc">Import Markdown, Obsidian, Notion, Apple Notes, Evernote or Feishu. In one writing workspace, Polish, Rewrite and Continue actions use the document context. KITE recalls current and past notes beside the draft. A writing agent harness plans the task, retrieves evidence, writes, checks and revises within limits. Review the changes and export Markdown or write to Obsidian, Notion or Feishu. This is a workflow illustration with fictional Maple content.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#b78129" stroke-width="2" stroke-linejoin="round"/></marker>
    <marker id="white-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#aeb5c0" stroke-width="2" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .ink{fill:#1c2025}.muted{fill:#59616c}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .small{font-size:22px}.body{font-size:27px}.label{font-size:20px;font-weight:600;letter-spacing:1.6px}
      .focus-ring{fill:none;stroke:#ffb545;stroke-width:5;opacity:0}
      .phase-actions #actions-focus,.phase-memory #memory-focus,.phase-harness #harness-focus,.phase-export #export-focus{opacity:1}
    </style>
  </defs>
  <rect width="1600" height="1120" rx="20" fill="#f4f1e9"/>
