  <title id="title">Bring your notes. Keep your workflow.</title>
  <desc id="desc">Explicit imports from Markdown, Obsidian, Notion, Apple Notes, Evernote and Feishu feed NOTE's memory and writing workspace. Export Markdown, write to a local Obsidian vault, or use configured Notion and Feishu destinations.</desc>
